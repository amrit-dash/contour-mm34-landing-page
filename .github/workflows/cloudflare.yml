name: Deploy landing page to Cloudflare

# Deploys site/ to Cloudflare Workers static assets on every push to main.
# Works with a private repo, unlike the Pages workflow, which the free plan
# refuses on private repositories.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify the build carries a robots noindex
        run: |
          grep -q 'name="robots"' site/index.html \
            || { echo "::error::site/index.html is missing the robots noindex meta; run npm run pack"; exit 1; }

      - name: Verify the noindex headers file survived
        run: test -f site/_headers

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
