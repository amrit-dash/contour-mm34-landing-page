name: Deploy landing page to Pages

# Branch-based Pages can only serve / or /docs; the packed deliverable lives
# in site/, so publish it as an artifact instead. No Jekyll runs on this path,
# which matters — the page contains ~400 {{ … }} placeholders.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the build carries a robots noindex
        run: |
          grep -q 'name="robots"' site/index.html \
            || { echo "::error::site/index.html is missing the robots noindex meta; run npm run pack"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
